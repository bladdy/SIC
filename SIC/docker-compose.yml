version: '3.9'

services:
  # ==========================
  # SQL SERVER
  # ==========================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sic_sqlserver
    environment:
      SA_PASSWORD: "Bladdy3434!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always
    networks:
      - sic_network

  # ==========================
  # BACKEND (.NET)
  # ==========================
  backend:
    build:
      context: .
      dockerfile: SIC.Backend/Dockerfile
    container_name: sic_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sic_sqlserver,1433;Database=SIC_DB;User Id=sa;Password=Bladdy3434!;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      - sqlserver
    expose:
      - "8080"
    restart: always
    networks:
      - sic_network

  # ==========================
  # FRONTEND + NGINX
  # ==========================
  frontend:
    build:
      context: .
      dockerfile: SIC.Frontend/Dockerfile
    container_name: sic_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    networks:
      - sic_network

  # ==========================
  # CERTBOT (Let's Encrypt)
  # ==========================
  certbot:
    image: certbot/certbot
    container_name: sic_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - ./config/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email sistemasic80@gmail.com --agree-tos --no-eff-email -d invboxv-app.com -d www.invboxv-app.com
    depends_on:
      - frontend
    networks:
      - sic_network

volumes:
  sql_data:

networks:
  sic_network:
    driver: bridge
