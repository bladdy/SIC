    <!-- ✅ META TAGS PARA COMPARTIR EN REDES SOCIALES -->
    <meta name="title" content="SIC - Sistema de Invitación y Confirmación" />
    <meta name="description" content="Un sistema que permite enviar invitaciones personalizadas a tus invitados y recibir sus confirmaciones de asistencia de manera rápida y sencilla, facilitando la organización y el control de tus eventos." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://invboxv-app.com/" />
    <meta property="og:title" content="SIC - Sistema de Invitación y Confirmación" />
    <meta property="og:description" content="Un sistema que permite enviar invitaciones personalizadas a tus invitados y recibir sus confirmaciones de asistencia de manera rápida y sencilla, facilitando la organización y el control de tus eventos." />
    <meta property="og:image" content="https://invboxv-app.com/logo.png" /> <!-- 🔹 cambia esta ruta por la imagen real -->
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://invboxv-app.com/" />
    <meta name="twitter:title" content="SIC - Sistema de Invitación y Confirmacións" />
    <meta name="twitter:description" content="Un sistema que permite enviar invitaciones personalizadas a tus invitados y recibir sus confirmaciones de asistencia de manera rápida y sencilla, facilitando la organización y el control de tus eventos." />
    <meta name="twitter:image" content="https://invboxv-app.com/logo.png" /> <!-- 🔹 misma imagen o una específica para Twitter -->
    <!-- iOS / Android Web App -->
    <meta name="apple-mobile-web-app-title" content="INVBOXV">
    <meta name="theme-color" content="#3C6A79" />

    <script>
        (function () {
            var match = location.pathname.match(/\/upload-photo\/([^\/]+)/);
            if (!match) return;
            var code = match[1];
            fetch('api/Events/byCode/' + code)
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (ev) {
                    if (!ev) return;
                    var img = ev.coverAlbumImageUrl || '';
                    if (!img) return;
                    if (img.startsWith('/')) img = location.origin + img;
                    var title = ev.name || '';
                    var desc = ev.subTitle || '';
                    var url = location.href;
                    function setMeta(sel, attr, val) {
                        var els = document.querySelectorAll(sel);
                        for (var i = 0; i < els.length; i++) els[i].setAttribute(attr, val);
                    }
                    setMeta('meta[property="og:image"]', 'content', img);
                    setMeta('meta[property="og:url"]', 'content', url);
                    if (title) setMeta('meta[property="og:title"]', 'content', title);
                    if (desc) setMeta('meta[property="og:description"]', 'content', desc);
                    setMeta('meta[name="twitter:image"]', 'content', img);
                    setMeta('meta[name="twitter:url"]', 'content', url);
                    if (title) setMeta('meta[name="twitter:title"]', 'content', title);
                    if (desc) setMeta('meta[name="twitter:description"]', 'content', desc);
                    if (title) document.title = title;
                })
                .catch(function () { });
        })();
    </script>
</head>

    <script>
        async function downloadFileFromStream(fileName, contentStreamReference) {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? 'archivo.bin';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        }
    </script>

        window.bootstrapModal = {
            show: (modalId) => {
                const modalEl = document.getElementById(modalId);
                const modal = new bootstrap.Modal(modalEl);
                modal.show();

            hide: (modalId) => {
                const modalEl = document.getElementById(modalId);
                const modal = bootstrap.Modal.getInstance(modalEl);
