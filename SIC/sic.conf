# =========================
# Redirección HTTP → HTTPS
# =========================
server {
    listen 80;
    server_name invboxv-app.com www.invboxv-app.com;
    return 301 https://$host$request_uri;
}

# =========================
# Servidor HTTPS principal
# =========================
server {
    listen 443 ssl;
    server_name invboxv-app.com www.invboxv-app.com;

    # Certificados SSL
    ssl_certificate     /etc/letsencrypt/live/invboxv-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invboxv-app.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # =========================
    # SIGNALR / WEBSOCKETS
    # =========================
    location /hubs/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # =========================
    # FRONTEND (Blazor / React)
    # =========================
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # BACKEND API (.NET)
    # =========================
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # ARCHIVOS / IMÁGENES
    # =========================
    location /files/ {
        proxy_pass http://127.0.0.1:9003/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # =========================
    # Seguridad
    # =========================
    client_max_body_size 50M;

    # =========================
    # Logs
    # =========================
    access_log /var/log/nginx/invboxv-access.log;
    error_log  /var/log/nginx/invboxv-error.log;
}
